<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ninja Gold — Setup</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
  </head>
  <body>
    <div class="page setup-page">
      <h1>Set Win Conditions</h1>
      <p class="subtitle">Define the rules before you start playing</p>

      <form action="/start_game" method="POST" class="setup-form">
        {% csrf_token %}

        <div class="field">
          <label for="max_moves">Max Moves</label>
          <input type="number" id="max_moves" name="max_moves" value="10" min="1" />
        </div>

        <div class="field">
          <label for="goal">Gold Goal</label>
          <input type="number" id="goal" name="goal" value="100" min="1" />
        </div>

        <button type="submit" class="btn btn-primary">Start Game</button>
      </form>

      <a href="/" class="skip-link">Skip and play freely</a>
    </div>
  </body>
</html>
