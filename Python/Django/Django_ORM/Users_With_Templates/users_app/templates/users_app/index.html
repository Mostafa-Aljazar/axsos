{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>C+R Users</title>
    <link rel="stylesheet" href="{% static 'users_app/css/style.css' %}" />
  </head>
  <body>
    <div class="container">
      <h2>All the Users</h2>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Email</th>
              <th>Age</th>
            </tr>
          </thead>
          <tbody>
            {% for user in users %}
            <tr>
              <td>{{ user.id }}</td>
              <td>{{ user.first_name }} {{ user.last_name }}</td>
              <td>{{ user.email_address }}</td>
              <td>{{ user.age }}</td>
            </tr>
            {% empty %}
            <tr>
              <td
                colspan="4"
                style="text-align: center; color: #aaa; padding: 20px"
              >
                No users yet.
              </td>
            </tr>
            {% endfor %}
          </tbody>
        </table>
      </div>

      <hr class="divider" />

      <div class="form-section">
        <h2>Add a User</h2>
        <form action="/create" method="POST" novalidate>
          {% csrf_token %}
          <div class="form-grid">
            <div class="form-group">
              <label for="first_name">First Name</label>
              <input
                type="text"
                id="first_name"
                name="first_name"
                placeholder=""
                required
              />
            </div>
            <div class="form-group">
              <label for="last_name">Last Name</label>
              <input
                type="text"
                id="last_name"
                name="last_name"
                placeholder=""
                required
              />
            </div>
            <div class="form-group">
              <label for="email_address">Email</label>
              <input
                type="email"
                id="email_address"
                name="email_address"
                placeholder=""
                required
              />
            </div>
            <div class="form-group">
              <label for="age">Age</label>
              <input
                type="number"
                id="age"
                name="age"
                placeholder=""
                min="1"
                max="120"
                required
              />
            </div>
          </div>
          <div class="btn-wrap">
            <button type="submit" id="add-btn">Add</button>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
