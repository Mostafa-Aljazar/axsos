{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delete a Course</title>
    <link rel="stylesheet" href="{% static 'courses_app/css/style.css' %}">
</head>
<body>
    <nav>
        <a href="/">Courses</a>
    </nav>

    <div class="container">
        <div class="card confirm-box">
            <h2>Are you sure you want to delete the following course?</h2>

            <p><strong>Name:</strong> {{ course.name }}</p>
            <p><strong>Description:</strong> {{ course.description }}</p>

            <div class="actions">
                <a href="/" class="btn btn-secondary">No</a>
                <form action="/courses/confirm_destroy/{{ course.id }}" method="POST">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">Yes! I want to delete this</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
