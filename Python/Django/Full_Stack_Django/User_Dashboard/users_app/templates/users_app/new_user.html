{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>New User — Test App</title>
    <link rel="stylesheet" href="{% static 'users_app/css/style.css' %}">
</head>
<body>
    <nav>
        <span class="brand">Test App</span>
        <a href="/dashboard" class="nav-link">Dashboard</a>
        <a href="/users/edit" class="nav-link">Profile</a>
        <a href="/logout" class="nav-link nav-right log-off">Log off</a>
    </nav>

    <div class="page">
        <div class="card" style="max-width:520px;">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
                <h2 style="margin:0;">Add a new user</h2>
                <a href="/dashboard/admin" class="btn btn-secondary btn-sm">Return to Dashboard</a>
            </div>

            {% if messages %}
            <div class="flash-box">
                <ul>{% for m in messages %}<li>{{ m }}</li>{% endfor %}</ul>
            </div>
            {% endif %}

            <form action="/users/create" method="POST">
                {% csrf_token %}
                <div class="form-group">
                    <label>Email Address:</label>
                    <input type="email" name="email">
                </div>
                <div class="form-group">
                    <label>First Name:</label>
                    <input type="text" name="first_name">
                </div>
                <div class="form-group">
                    <label>Last Name:</label>
                    <input type="text" name="last_name">
                </div>
                <div class="form-group">
                    <label>Password:</label>
                    <input type="password" name="password">
                </div>
                <div class="form-group">
                    <label>Password Confirmation:</label>
                    <input type="password" name="confirm_pw">
                </div>
                <button type="submit" class="btn btn-success">Create</button>
            </form>
        </div>
    </div>
</body>
</html>
