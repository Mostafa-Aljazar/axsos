{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Profile — Test App</title>
    <link rel="stylesheet" href="{% static 'users_app/css/style.css' %}">
</head>
<body>
    <nav>
        <span class="brand">Test App</span>
        <a href="/dashboard" class="nav-link">Dashboard</a>
        <a href="/users/edit" class="nav-link">Profile</a>
        <a href="/logout" class="nav-link nav-right log-off">Log off</a>
    </nav>

    <div class="page">
        <div class="card" style="max-width:720px;">
            <h2>Edit profile</h2>

            {% if messages %}
            <div class="flash-box">
                <ul>{% for m in messages %}<li>{{ m }}</li>{% endfor %}</ul>
            </div>
            {% endif %}

            <div class="two-col" style="gap:32px;align-items:flex-start;">
                <!-- Edit Info + Description -->
                <div class="col-main">
                    <form action="/users/edit/submit" method="POST">
                        {% csrf_token %}
                        <div class="form-section-title">Edit Information</div>
                        <div class="form-group">
                            <label>Email Address</label>
                            <input type="email" name="email" value="{{ user.email }}">
                        </div>
                        <div class="form-group">
                            <label>First Name</label>
                            <input type="text" name="first_name" value="{{ user.first_name }}">
                        </div>
                        <div class="form-group">
                            <label>Last Name</label>
                            <input type="text" name="last_name" value="{{ user.last_name }}">
                        </div>
                        <button type="submit" class="btn btn-primary btn-sm">Save</button>

                        <div style="margin-top:24px;">
                            <div class="form-section-title">Edit Description</div>
                            <div class="form-group">
                                <textarea name="description" rows="4">{{ user.description }}</textarea>
                            </div>
                            <button type="submit" class="btn btn-primary btn-sm">Save</button>
                        </div>
                    </form>
                </div>

                <!-- Change Password -->
                <div class="col-side" style="flex:0 0 260px;">
                    <form action="/users/edit/submit" method="POST">
                        {% csrf_token %}
                        <input type="hidden" name="email" value="{{ user.email }}">
                        <input type="hidden" name="first_name" value="{{ user.first_name }}">
                        <input type="hidden" name="last_name" value="{{ user.last_name }}">
                        <input type="hidden" name="description" value="{{ user.description }}">
                        <div class="form-section-title">Change Password</div>
                        <div class="form-group">
                            <label>Password</label>
                            <input type="password" name="password">
                        </div>
                        <div class="form-group">
                            <label>Password Confirmation</label>
                            <input type="password" name="confirm_pw">
                        </div>
                        <button type="submit" class="btn btn-success btn-sm">Update Password</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
