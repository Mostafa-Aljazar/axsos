{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit User — Test App</title>
    <link rel="stylesheet" href="{% static 'users_app/css/style.css' %}">
</head>
<body>
    <nav>
        <span class="brand">Test App</span>
        <a href="/dashboard" class="nav-link">Dashboard</a>
        <a href="/users/edit" class="nav-link">Profile</a>
        <a href="/logout" class="nav-link nav-right log-off">Log off</a>
    </nav>

    <div class="page">
        <div class="card" style="max-width:680px;">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
                <h2 style="margin:0;">Edit user #{{ profile.id }}</h2>
                <a href="/dashboard/admin" class="btn btn-secondary btn-sm">Return to Dashboard</a>
            </div>

            {% if messages %}
            <div class="flash-box">
                <ul>{% for m in messages %}<li>{{ m }}</li>{% endfor %}</ul>
            </div>
            {% endif %}

            <div class="two-col" style="gap:32px;">
                <!-- Edit Info -->
                <div class="col-main">
                    <form action="/users/edit/{{ profile.id }}/submit" method="POST">
                        {% csrf_token %}
                        <div class="form-section-title">Edit Information</div>
                        <div class="form-group">
                            <label>Email Address</label>
                            <input type="email" name="email" value="{{ profile.email }}">
                        </div>
                        <div class="form-group">
                            <label>First Name</label>
                            <input type="text" name="first_name" value="{{ profile.first_name }}">
                        </div>
                        <div class="form-group">
                            <label>Last Name</label>
                            <input type="text" name="last_name" value="{{ profile.last_name }}">
                        </div>
                        <div class="form-group">
                            <label>User Level</label>
                            <select name="user_level">
                                <option value="1" {% if profile.user_level == 1 %}selected{% endif %}>Normal</option>
                                <option value="9" {% if profile.user_level == 9 %}selected{% endif %}>Admin</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary btn-sm">Save</button>
                    </form>
                </div>

                <!-- Change Password -->
                <div class="col-side" style="flex:0 0 260px;">
                    <form action="/users/edit/{{ profile.id }}/submit" method="POST">
                        {% csrf_token %}
                        <div class="form-section-title">Change Password</div>
                        <input type="hidden" name="email" value="{{ profile.email }}">
                        <input type="hidden" name="first_name" value="{{ profile.first_name }}">
                        <input type="hidden" name="last_name" value="{{ profile.last_name }}">
                        <input type="hidden" name="user_level" value="{{ profile.user_level }}">
                        <div class="form-group">
                            <label>Password</label>
                            <input type="password" name="password">
                        </div>
                        <div class="form-group">
                            <label>Password Confirmation</label>
                            <input type="password" name="confirm_pw">
                        </div>
                        <button type="submit" class="btn btn-success btn-sm">Update Password</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
