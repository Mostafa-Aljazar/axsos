{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Welcome — DojoReads</title>
    <link rel="stylesheet" href="{% static 'books_app/css/style.css' %}">
    <style>
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #1a252f; }
        .welcome-card { background: #fff; border-radius: 12px; padding: 36px 40px; box-shadow: 0 4px 20px rgba(0,0,0,0.2); width: 100%; max-width: 760px; }
        .welcome-card h1 { color: #1a252f; font-size: 22px; margin-bottom: 28px; text-align: center; }
    </style>
</head>
<body>
    <div class="welcome-card">
        <h1>Welcome to DojoReads</h1>

        {% if messages %}
        <div class="flash-box">
            <ul>{% for m in messages %}<li>{{ m }}</li>{% endfor %}</ul>
        </div>
        {% endif %}

        <div class="panels">
            <!-- Register -->
            <div style="flex:1;">
                <h2>Register</h2>
                <form action="/register" method="POST">
                    {% csrf_token %}
                    <div class="form-group">
                        <label>Name</label>
                        <input type="text" name="name">
                    </div>
                    <div class="form-group">
                        <label>Alias</label>
                        <input type="text" name="alias">
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" name="email">
                    </div>
                    <div class="form-group">
                        <label>Password <small style="color:#aaa;font-weight:400;">(min 8 characters)</small></label>
                        <input type="password" name="password">
                    </div>
                    <div class="form-group">
                        <label>Confirm Password</label>
                        <input type="password" name="confirm_pw">
                    </div>
                    <button type="submit" class="btn btn-primary">Register</button>
                </form>
            </div>

            <div class="divider"></div>

            <!-- Login -->
            <div style="flex:1;">
                <h2>Login</h2>
                <form action="/login" method="POST">
                    {% csrf_token %}
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" name="email">
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" name="password">
                    </div>
                    <button type="submit" class="btn btn-primary">Login</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
