<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Checkerboard</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>
  <body>
    <div class="board">
      {% for i in range(rows) %}
      <div class="row">
        {% for j in range(cols) %}
        <div
          class="cell"
          style="background-color: {{ color1 if (i+j)%2==0 else color2 }}"
        ></div>
        {% endfor %}
      </div>
      {% endfor %}
    </div>
  </body>
</html>
