<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Card</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="user-card">
      <div class="hero"></div>

      <div class="profile">
        <img src="./assets/avatar.jpeg" alt="User Avatar" class="avatar" />

        <h2 class="username">John Doe</h2>

        <div class="location-row">
          <img src="./assets/map.png" class="icon" />
          <p>Seattle</p>
        </div>

        <p class="title">Developer | Engineer | Problem Solver</p>
        <p class="tagline">Master of shadows and the Internet!</p>

        <div class="edit">
          <img src="./assets/setting.png" class="icon" />
          <a href="#">edit profile</a>
        </div>
      </div>
    </div>
  </body>
</html>
