<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Likes Feed</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="navbar">Network</div>

      <div class="layout">
        <div class="sidebar">
          <div class="profile">
            <img
              src="./assets/IMG_PROFILE.png"
              alt="IMG_PROFILE"
              class="avatar"
            />
            <h3>James Doe</h3>
          </div>
        </div>

        <div class="feed">
          <div class="card">
            <div class="header">
              <span class="username">Neil M</span>
              <span class="likes">9 like(s)</span>
              <button class="like-btn">Like</button>
            </div>
            <p>
              I just set up this new discord bot, let me know what you all
              think! <a href="#">link</a>
            </p>
          </div>

          <div class="card">
            <div class="header">
              <span class="username">Nicole K</span>
              <span class="likes">12 like(s)</span>
              <button class="like-btn">Like</button>
            </div>
            <p>Just finished my <a href="#">next comic</a>, check it out!</p>
          </div>

          <div class="card">
            <div class="header">
              <span class="username">Jim R</span>
              <span class="likes">4 like(s)</span>
              <button class="like-btn">Like</button>
            </div>
            <p>I can't stop listening to the <a href="#">new album</a></p>
            <p>What do you guys think?</p>
          </div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
