<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="description"
      content="Personal portfolio – Skills and contact."
    />
    <title>Personal Portfolio</title>
  </head>
  <body>
    <div>
      <h1>Programmer Name</h1>

      <img src="./assets//IMG_PROFILE.png" alt="profile image" />
      <div>
        <a href="#">
          <img
            src="./assets//IMG_GITHUB.png"
            alt="github image"
            width="20px"
            height="20px"
          />
          my github
        </a>
        <a href="#">
          <img
            src="./assets//IMG_LINKEDIN.png"
            alt="linkedin image"
            width="20px"
            height="20px"
          />
          my linkedin
        </a>
        <a href="#">
          <img
            src="./assets//IMG_MAIL.png"
            alt="email image"
            width="30px"
            height="20px"
          />
          my email
        </a>
      </div>
    </div>

    <h2>Technologies</h2>
    <table>
      <tr>
        <th>Front-End</th>
        <th>Python</th>
        <th>JavaScript</th>
        <th>Database</th>
        <th>Concepts</th>
      </tr>

      <tr>
        <td>HTML5</td>
        <td>Django</td>
        <td>Express</td>
        <td>MySQL</td>
        <td>AJAX</td>
      </tr>

      <tr>
        <td>CSS3</td>
        <td>Flask</td>
        <td>Mongoose</td>
        <td>MongoDB</td>
        <td>OOP</td>
      </tr>

      <tr>
        <td>Bootstrap</td>
        <td>Unittest</td>
        <td>React</td>
        <td></td>
        <td>REST</td>
      </tr>
    </table>

    <div>
      <h2>Social Snakes</h2>
      <img src="./assets//IMG_CODE.png" alt="Social image" />
      <p>
        Social Media App made in python - <a href="#">code</a> |
        <a href="#">deploy</a>
      </p>
    </div>

    <div>
      <h2>Contact Me</h2>

      <form action="#" method="get">
        <label for="contact-name">Name :</label>
        <input type="text" id="contact-name" name="name" />

        <label for="contact-email">Email :</label>
        <input type="email" id="contact-email" name="email" />

        <div>
          <label for="contact-message">Message :</label>
          <br />
          <textarea
            id="contact-message"
            name="message"
            rows="4"
            cols="50"
          ></textarea>
        </div>

        <input type="submit" value="Send Message" />
      </form>
    </div>
  </body>
</html>
