<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration Form</title>
  </head>
  <body>
    <h1>Registration Form</h1>
    <form>
      <div>
        <label for="first_name">First Name: *</label>
        <input type="text" required id="first_name" name="first_name" />
      </div>

      <div>
        <label for="last_name">Last Name: *</label>
        <input type="text" required id="last_name" name="last_name" />
      </div>

      <div>
        <label for="email">Email Address: *</label>
        <input type="email" required id="email" name="email" />
      </div>

      <div>
        <label for="password">Password: *</label>
        <input type="password" required id="password" name="password" />
      </div>

      <div>
        <label for="confirm_password">Confirm Password: *</label>
        <input
          type="password"
          required
          id="confirm_password"
          name="confirm_password"
        />
      </div>

      <div>
        <label for="birthday">Birthday</label>
        <input type="date" required id="birthday" name="birthday" />
      </div>

      <div>
        <label for="gender">Gender Identity</label>
        <input type="radio" id="male" name="gender" value="male" />
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female" />
        <label for="female">Female</label>
        <input type="radio" id="non-binary" name="gender" value="non-binary" />
        <label for="non-binary">Non-binary</label>
        <input
          type="radio"
          id="prefer-not-to-answe"
          name="gender"
          value="prefer-not-to-answer"
        />
        <label for="prefer-not-to-answer">Prefer not to answer</label>
      </div>

      <div>
        <div>
          <label for="description">A short description about myself</label>
        </div>
        <textarea
          required
          id="description"
          name="description"
          cols="30"
          rows="10"
        ></textarea>
      </div>

      <div>
        <label for="favorite_language">Favorite Language</label>
        <select name="favorite_language" id="favorite_language">
          <option value="html">HTML</option>
          <option value="css">CSS</option>
          <option value="javascript">JavaScript</option>
          <option value="python">Python</option>
        </select>
      </div>

      <div>
        <input type="checkbox" required id="terms" name="terms" />
        <label for="terms"
          >Yes, I would like to receive periodic email updates</label
        >
      </div>

      <button type="submit">Create Account</button>
      <p>* Indicates a required field</p>
    </form>
  </body>
</html>
